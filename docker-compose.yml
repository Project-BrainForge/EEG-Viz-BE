version: '3.8'

services:
  eegviz-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eegviz-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount code for hot-reloading in development
      - ./app.py:/app/app.py
      - ./models:/app/models
      - ./services:/app/services
      - ./routers:/app/routers
      - ./utils:/app/utils
      # Don't mount anatomy folder - keep it in the container
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - eegviz-network

networks:
  eegviz-network:
    driver: bridge
